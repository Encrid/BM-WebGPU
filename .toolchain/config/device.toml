[parts.device]
name = "BM-WebGPU-Device"
uses = ["wgpu_native", "contract"]
third_party = []

[parts.device.package]
proof = "tests/device/package/proof.c"
include = ["{bridge}/include", "include/contract"]

[compose.device]
part = "device"
from = "include/device"
headers = ["*.h"]
into = "include"

[[source]]
name = "sdl3"
url = "https://github.com/Encrid/BM-SDL3/releases/download/sdl3-v0.2.0/BL-SDL3.zip"
sha256 = "268ff2e0c7e1e17d7a1a639c8418ecc5b80ab0cfc167086072a2e3ef5cc0fdde"
into = "build/third_party/sdl3"
top = "{target}"

[leaks.kinds.webgpu_adapter]
takes = { take_adapter = "2" }
gives = { wgpuAdapterRelease = "1" }

[leaks.kinds.webgpu_device]
takes = { take_device = "2" }
gives = { wgpuDeviceRelease = "1" }

[variables]
device_probe_words = [
    "abi=2", "config=test:Scene", "settings=scene module", "pinned=true", "reloadable=false",
    "scratch=16384", "log_ring=2048", "spans=4096", "spawns=none", "changes=96", "persistent=none",
    "hot_reload=false", "config.scene=none", "config.module=none",
]

[kinds.stand_in]
output = "{name}{library}"
steps = [
    { run = ["{python}", "tests/device/stand_in/calls.py", "{work}.c", "{sources}", "{manifest}"] },
    { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "-shared", "{pic}", "{soname}", "{optimize}", "{float}", "{errno}", "{language}", "{define}", "{defines}", "{include}", "{work}.c", "{flags}", "-o", "{output}"] },
]

[[artifact]]
name = "webgpu_device"
kind = "wgpu_module"
part = "device"
sources = ["src/device/*.c"]
include = ["include/device", "include/contract", "{wgpu_native}/include"]
flags = ["{rpath}"]
manifest = [
    "webgpu:device@1.0.0", "abi=2", "config=webgpu:DeviceSettings",
    "settings=present format alpha power fallback backend feature_level samples depth limits features error_room instance_backends instance_flags d3d12_compiler d3d12_swapchain gles_version gl_fence creation_threshold loss_threshold dxc_path",
    "pinned=true", "reloadable=false", "hot_reload=false", "scratch=16384", "log_ring=2048", "spans=4096",
    "spawns=none", "persistent=none", "changes=88",
    "config.present=WEBGPU_PRESENT_FIFO", "config.format=WEBGPU_FORMAT_PREFERRED", "config.alpha=WEBGPU_ALPHA_AUTO",
    "config.power=WEBGPU_POWER_HIGH_PERFORMANCE", "config.fallback=false", "config.backend=WEBGPU_BACKEND_ANY",
    "config.feature_level=WEBGPU_FEATURE_LEVEL_CORE", "config.samples=WEBGPU_SAMPLES_1",
    "config.depth=WEBGPU_DEPTH_24_PLUS_STENCIL_8", "config.limits=WEBGPU_LIMITS_ADAPTER",
    "config.features=WEBGPU_FEATURES_ADAPTER", "config.error_room=8192",
    "config.instance_backends=0", "config.instance_flags=16777216", "config.d3d12_compiler=WEBGPU_D3D12_COMPILER_AUTO",
    "config.d3d12_swapchain=WEBGPU_D3D12_SWAPCHAIN_HWND", "config.gles_version=WEBGPU_GLES_VERSION_AUTO",
    "config.gl_fence=WEBGPU_GL_FENCE_NORMAL", "config.creation_threshold=0", "config.loss_threshold=0",
    "config.dxc_path=dxcompiler.dll",
]

[[artifact]]
name = "device_probe"
kind = "wgpu_module"
part = "device"
test = true
sources = ["tests/device/probe/probe.c"]
include = ["include/device", "include/contract", "{wgpu_native}/include", "{sdl3}/include"]
flags = ["{sdl3}/SDL3{library}", "{rpath}"]
manifest = ["test:probe@1.0.0", "{device_probe_words}"]

[[artifact.variants]]
name = "device_other"
defines = ["OTHER_STORAGE"]
manifest = ["test:probe@1.0.0", "{device_probe_words}"]

[[artifact]]
name = "importer"
kind = "wgpu_module"
part = "device"
test = true
sources = ["tests/device/stand_in/importer.c"]
include = ["{wgpu_native}/include"]
flags = ["{rpath}"]
manifest = [
    "test:importer@1.0.0", "abi=2", "config=none", "pinned=false", "reloadable=false", "scratch=4096",
    "log_ring=64", "spans=1024", "spawns=none", "changes=none", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "{wgpu_name}"
kind = "stand_in"
part = "device"
test = true
folder = "stand_in"
sources = ["tests/device/stand_in/stand_in.c"]
include = ["{wgpu_native}/include"]
defines = ["_GNU_SOURCE"]
flags = ["{dl}"]
manifest = ["{wgpu_native}/include/webgpu/webgpu.h", "{wgpu_native}/include/webgpu/wgpu.h"]

[[artifact]]
name = "device_layout"
kind = "program"
part = "device"
test = true
sources = ["tests/device/layout/layout.c"]
include = ["include/device", "include/contract", "{bridge}/include"]

[targets.x86_64-windows-gnu]
wgpu_name = "wgpu_native"
frame_preset = "warp.toml"
video_driver = "windows"
foreign_backend = "WEBGPU_BACKEND_METAL"
native_backend = "WEBGPU_BACKEND_D3D12"
mailbox_frame = "render: r4 frame 1 27 47 1 64 64 1 1 1 1 1 0 0"
given_samples = "WEBGPU_SAMPLES_8"
given_frame = "record[6] test:probe@1.0.0/render: r5 frame 1 27 47 8 64 64 1 1 1 2 1 0 0"
stale_frame = "1 27 47 1 64 64 1 1 1 1 1 0 0"
wayland_window = "record[3] -/-: module 'test:probe@1.0.0' did not load: its init answered 1 0 0"
wayland_frame = "not loaded: m/device_probe{library}: test:probe@1.0.0 was refused"
no_display_says = "record[6] test:probe@1.0.0/render: r4 frame 1 27 47 1 64 64 1 1 1 1 1 0 0"
no_wayland_handle_says = "record[3] -/-: module 'test:probe@1.0.0' did not load: its init answered 1 0 0"
native_instance_backend = "8"
foreign_instance_backend = "4"
missing_dxc_says = "no device: no adapter: Validation Error.*dx12 drivers/libraries could not be loaded"
visual_says = '\A(?!.*no alpha).*render: r4 frame 1 27 47 1 64 64 1 1 1 1 1 0 0'

