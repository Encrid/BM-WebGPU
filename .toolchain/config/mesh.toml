[parts.mesh]
name = "BM-WebGPU-Mesh"
uses = ["wgpu_native", "contract"]
third_party = []

[parts.mesh.package]
proof = "tests/mesh/package/proof.c"
include = ["{bridge}/include"]

[compose.mesh]
part = "mesh"
from = "include/mesh"
headers = ["*.h"]
into = "include"

[variables]
mesh_words = [
    "config=webgpu:MeshSettings",
    "settings=load blend clear_depth depth_compare cull clockwise repeat gpu_memory",
    "pinned=false", "reloadable=false", "hot_reload=false", "scratch=8192", "log_ring=64",
    "spans=65536", "spawns=none", "persistent=none", "changes=65536",
    "config.load=WEBGPU_LOAD_CLEAR", "config.blend=true", "config.clear_depth=1.0",
    "config.depth_compare=WEBGPU_COMPARE_LESS_EQUAL", "config.cull=WEBGPU_CULL_NONE",
    "config.clockwise=false", "config.repeat=true", "config.gpu_memory=9223372036854775807",
]
mesh_probe_words = [
    "abi=2", "settings=scene module", "pinned=false", "reloadable=false", "scratch=16384",
    "log_ring=8192", "spans=65536", "spawns=1024", "changes=131072", "persistent=1048576",
    "hot_reload=false", "config.scene=none", "config.module=none",
]
watch_words = [
    "abi=2", "config=none", "pinned=false", "reloadable=false", "scratch=4096", "log_ring=256",
    "spans=8192", "spawns=none", "changes=none", "persistent=none", "hot_reload=false",
]

[[artifact]]
name = "webgpu_mesh"
kind = "wgpu_module"
part = "mesh"
sources = ["src/mesh/*.c"]
include = ["include/mesh", "include/contract", "{wgpu_native}/include"]
flags = ["{rpath}"]
manifest = ["webgpu:mesh@1.0.0", "abi=2", "{mesh_words}"]

[[artifact.variants]]
name = "abi1"
test = true
manifest = ["webgpu:mesh@1.0.0", "abi=1", "{mesh_words}"]

[[artifact.variants]]
name = "mesh_foreign"
test = true
manifest = ["test:mesh@1.0.0", "abi=2", "{mesh_words}"]

[[artifact]]
name = "mesh_probe"
kind = "wgpu_module"
part = "mesh"
test = true
sources = ["tests/mesh/probe/*.c"]
include = ["include/mesh", "include/contract", "{wgpu_native}/include"]
flags = ["{rpath}", "{dl}"]
manifest = ["webgpu:probe@1.0.0", "config=webgpu:ProbeScene", "{mesh_probe_words}"]

[[artifact.variants]]
name = "mesh_app"
defines = ["APP"]
manifest = ["test:app@1.0.0", "config=test:ProbeScene", "{mesh_probe_words}"]

[[artifact]]
name = "watcher"
kind = "native_module"
part = "mesh"
test = true
sources = ["tests/mesh/watch/watch.c"]
include = ["include/mesh"]
defines = ["WATCHED=webgpu_mesh_t", 'WATCHED_NAME="webgpu:Mesh"']
manifest = ["webgpu:watcher@1.0.0", "{watch_words}"]

[[artifact.variants]]
name = "twatcher"
defines = ["WATCHED=webgpu_texture_t", 'WATCHED_NAME="webgpu:Texture"']
manifest = ["webgpu:twatcher@1.0.0", "{watch_words}"]

[[artifact.variants]]
name = "mwriter"
defines = ["WATCHED=webgpu_mesh_t", 'WATCHED_NAME="webgpu:Mesh"', 'PHASE="render"']
manifest = ["webgpu:watcher@1.0.0", "{watch_words}"]

[[artifact.variants]]
name = "twriter"
defines = ["WATCHED=webgpu_texture_t", 'WATCHED_NAME="webgpu:Texture"', 'PHASE="render"']
manifest = ["webgpu:watcher@1.0.0", "{watch_words}"]

[[artifact.variants]]
name = "dwriter"
defines = ["WATCHED=webgpu_draw_t", 'WATCHED_NAME="webgpu:Draw"', 'PHASE="render"']
manifest = ["webgpu:watcher@1.0.0", "{watch_words}"]

[[artifact.variants]]
name = "bwriter"
defines = ["WATCHED=webgpu_batch_t", 'WATCHED_NAME="webgpu:Batch"', 'PHASE="render"']
manifest = ["webgpu:watcher@1.0.0", "{watch_words}"]

[[artifact.variants]]
name = "vwriter"
defines = ["WATCHED=webgpu_view_t", 'WATCHED_NAME="webgpu:View"', 'PHASE="render"']
manifest = ["webgpu:watcher@1.0.0", "{watch_words}"]

[[artifact]]
name = "fake"
kind = "native_module"
part = "mesh"
test = true
sources = ["tests/mesh/fake/fake.c"]
include = ["include/contract"]
manifest = ["webgpu:fake@1.0.0", "{watch_words}"]

[[artifact]]
name = "types"
kind = "program"
part = "mesh"
test = true
sources = ["tests/mesh/types/types.c"]
include = ["include/mesh", "{bridge}/include"]
