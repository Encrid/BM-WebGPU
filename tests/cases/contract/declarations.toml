[[case]]
name = "a module of the namespace webgpu declares the four types with no grant"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: webgpu:probe@1.0.0, native, m/probe{library}"] }

[case.folders]
"{case}/m" = ["probe"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/world.toml"]
[content]
paths = ["m"]
[backend]
native = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/m" = ["foreign"]

