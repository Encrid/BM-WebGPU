[[case]]
name = "the app loads with write on webgpu:Window and read on webgpu:webgpu_surface_t"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
claims = { status = 0, line = ["loaded: test:app@1.0.0, native, m/app{library}"] }

[case.folders]
"{case}/m" = ["app"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/world.toml"]
[content]
paths = ["m"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:app@1.0.0"]
write = ["webgpu:Window"]
read = ["webgpu:webgpu_surface_t"]
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/world.toml"]
[content]
paths = ["m"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:app@1.0.0"]
write = []
read = ["webgpu:Window", "webgpu:webgpu_surface_t"]
'''

[[case]]
name = "the app needs read on webgpu:webgpu_surface_t"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'test:app@1.0.0' did not load: it may not declare 'webgpu:webgpu_surface_t': that is another namespace's, and no grant names it 0 0",
    "not loaded: m/app{library}: test:app@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["app"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/world.toml"]
[content]
paths = ["m"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:app@1.0.0"]
write = ["webgpu:Window"]
read = []
'''

[case.false.files]
