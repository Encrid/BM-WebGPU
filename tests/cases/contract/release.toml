[[case]]
name = "the release of a target holds the header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "contract", "--pack"]
claims = { status = 0, line = [
    "{case}/out/BL-WebGPU-Contract-{target}.zip", "include/webgpu_contract.h", "license",
    "package proof: BL-WebGPU-Contract ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--part", "contract"] }
