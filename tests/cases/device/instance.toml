ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:device@1.0.0".config]
creation_threshold = 255
'''

[[case]]
name = "a loss_threshold of 256 does not load the module"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
line = ["record[3] -/-: module 'webgpu:device@1.0.0' did not load: its setting 'loss_threshold' is 256, which the field it names cannot hold 0 0"]

[case.folders]
"{case}/m" = ["webgpu_device", "{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["frame", "present"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:device@1.0.0".config]
loss_threshold = 256
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["frame", "present"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:device@1.0.0".config]
loss_threshold = 255
'''

[[case]]
name = "a dxc_path of 1024 bytes does not load the module"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
line = ["record[3] -/-: module 'webgpu:device@1.0.0' did not load: its setting 'dxc_path' is 1024 bytes of text, and the field it names holds 1024 with the zero that ends it 0 0"]

[case.folders]
"{case}/m" = ["webgpu_device", "{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["frame", "present"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:device@1.0.0".config]
dxc_path = ""
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["frame", "present"]
rounds = 2
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:device@1.0.0".config]
dxc_path = ""
'''
