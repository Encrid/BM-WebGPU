[[case]]
name = "the defaults give the instance each backend, the flags of the build, AUTO, HWND, dxcompiler.dll and no threshold"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{video_driver}", STAND_IN_TELL = "1" }

[case.claims]
line = ["stand-in: instance backends 0 flags 16777216 compiler 0 path 'dxcompiler.dll' swapchain 1 gles 0 fence 0 creation -1 loss -1 display 0"]

[case.folders]
"{case}/m" = ["webgpu_device", "device_probe", "{sdl3}/SDL3{library}", "{wgpu_name}"]
"{case}/m/real" = ["{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/device/presets/{frame_preset}"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}", "m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/device/presets/{frame_preset}"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}", "m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
[module."webgpu:device@1.0.0".config]
d3d12_compiler = "WEBGPU_D3D12_COMPILER_FXC"
'''

