[[case]]
name = "a deployment states a constant of a setting by its name"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[case.claims]
line = ["record[6] test:probe@1.0.0/render: r1 settings 4 1"]

[case.folders]
"{case}/m" = ["webgpu_device", "probe", "{sdl3}/SDL3{library}", "{wgpu_native}/{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/frame.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}", "m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "tune"
[module."webgpu:device@1.0.0".config]
present = "WEBGPU_PRESENT_MAILBOX"
'''

[case.false.files]
"{case}/d.toml" = '''
