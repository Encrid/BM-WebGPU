[[case]]
name = "webgpu_present_t, webgpu_format_t and webgpu_alpha_t have 4 bytes, and each constant has the value of its table"
run = ["{out}/layout{exe}", "modes"]
claims = { status = 0, order = [
    "webgpu_present_t size 4 alignment 4", "WEBGPU_PRESENT_FIFO 1", "WEBGPU_PRESENT_FIFO_RELAXED 2",
    "WEBGPU_PRESENT_IMMEDIATE 3", "WEBGPU_PRESENT_MAILBOX 4",
    "webgpu_format_t size 4 alignment 4", "WEBGPU_FORMAT_PREFERRED 1", "WEBGPU_FORMAT_BGRA8_UNORM 2",
    "WEBGPU_FORMAT_BGRA8_UNORM_SRGB 3", "WEBGPU_FORMAT_RGBA8_UNORM 4", "WEBGPU_FORMAT_RGBA8_UNORM_SRGB 5",
    "WEBGPU_FORMAT_RGB10A2_UNORM 6", "WEBGPU_FORMAT_RGBA16_FLOAT 7",
    "webgpu_alpha_t size 4 alignment 4", "WEBGPU_ALPHA_AUTO 1", "WEBGPU_ALPHA_OPAQUE 2",
    "WEBGPU_ALPHA_PREMULTIPLIED 3", "WEBGPU_ALPHA_UNPREMULTIPLIED 4", "WEBGPU_ALPHA_INHERIT 5",
] }
false = { run = ["{out}/layout{exe}", "adapter"] }

