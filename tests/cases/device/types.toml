[[case]]
name = "a module that declares the types of the module as The declarations tells loads beside it, and another storage layout is refused"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[case.claims]
has = ["loaded: webgpu:device@1.0.0, native", "loaded: test:probe@1.0.0, native"]
lacks = ["was refused"]

[case.folders]
"{case}/m" = ["webgpu_device", "probe", "{sdl3}/SDL3{library}", "{wgpu_native}/{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/{frame_preset}"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}", "m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

[case.false.folders]
"{case}/m" = ["webgpu_device", "other", "{sdl3}/SDL3{library}", "{wgpu_native}/{wgpu_file}"]
