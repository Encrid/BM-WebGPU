run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include", "-I", "{webgpu_contract}/include", "-I", "{bridge}/include", "-c", "tests/layout/alone.c", "-o", "{case}/alone.o"]
