[[case]]
name = "past gpu_memory the module leaves out the new item, and writes the line at the level 4"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
status = 0
line = [
    'record[4] webgpu:mesh@1.0.0/keep_meshes: no room: 612 bytes of gpu_memory are taken, and the item needs 72 more 70 0',
    'record[6] webgpu:probe@1.0.0/check: r4 pixel 16 32 is 255 0 0 255',
    'record[6] webgpu:probe@1.0.0/check: r4 pixel 48 32 is 51 102 153 255',
]

[case.folders]
"{case}/m" = ["webgpu_mesh", "probe", "{wgpu_native}/{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:mesh@1.0.0".config]
gpu_memory = 650
[module."webgpu:probe@1.0.0".config]
scene = "noroom"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:probe@1.0.0".config]
scene = "noroom"
'''

