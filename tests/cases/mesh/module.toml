[[case]]
name = "--show-config shows the words of the manifest and each default of the module"
run = ["{bridge_host}/bridge-host{exe}", "--show-config", "{case}/d.toml"]

[case.claims]
status = 0
order = [
    'module webgpu:mesh@1.0.0, native, m/webgpu_mesh{library}',
    'config = "webgpu:MeshSettings"  its file',
    'settings = "load blend clear_depth depth_compare cull clockwise repeat gpu_memory"  its file',
    'pinned = false  its file',
    'reloadable = false  its file',
    'hot_reload = false  its file',
    'scratch = 8192  its file',
    'log_ring = 64  its file',
    'spans = 65536  its file',
    'spawns = "none"  its file',
    'persistent = "none"  its file',
    'changes = 65536  its file',
    'config.load = "WEBGPU_LOAD_CLEAR"  its file',
    'config.blend = true  its file',
    'config.depth_compare = "WEBGPU_COMPARE_LESS_EQUAL"  its file',
    'config.cull = "WEBGPU_CULL_NONE"  its file',
    'config.clockwise = false  its file',
    'config.repeat = true  its file',
    'config.gpu_memory = 9223372036854775807  its file',
]
matches = ['(?m)^  config\.clear_depth = 1(\.0)?  its file$']

[case.folders]
"{case}/m" = ["webgpu_mesh", "{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/mesh/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/m" = ["{wgpu_file}"]

[[case]]
name = "a key of the deployment replaces a default of the manifest"
run = ["{bridge_host}/bridge-host{exe}", "--show-config", "{case}/d.toml"]

[case.claims]
status = 0
lacks = ['spans = 65536  its file']
matches = ['(?m)^  spans = 131072  .*d\.toml:8$']

