"{case}/d.toml" = '''
presets = ["{root}/tests/mesh/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:mesh@1.0.0".config]
load = "WEBGPU_LOAD_KEEP"
[module."webgpu:probe@1.0.0".config]
scene = "noview"
'''

[[case]]
name = "a second round with no device releases nothing more, and the next ready round draws again"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
status = 0
line = [
    'record[6] webgpu:probe@1.0.0/check: r3 holds 0 buffers 0 textures 0 views 0 groups 0 samplers 0 0',
    'record[6] webgpu:probe@1.0.0/check: r4 holds 0 buffers 0 textures 0 views 0 groups 0 samplers 0 0',
    'record[6] webgpu:probe@1.0.0/check: r5 pixel 32 32 is 255 0 0 255',
]

[case.folders]
"{case}/m" = ["webgpu_mesh", "mesh_probe", "{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/mesh/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:probe@1.0.0".config]
scene = "lostagain"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/mesh/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:probe@1.0.0".config]
scene = "steady"
'''
