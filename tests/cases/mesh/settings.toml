line = ['record[6] webgpu:probe@1.0.0/check: r2 pixel 32 32 is 0 255 0 255']

[case.folders]
"{case}/m" = ["webgpu_mesh", "mesh_probe", "{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/mesh/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:mesh@1.0.0".config]
clear_depth = 0.0
depth_compare = "WEBGPU_COMPARE_NEVER"
[module."webgpu:probe@1.0.0".config]
scene = "nodepth"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/mesh/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
[module."webgpu:mesh@1.0.0".config]
clear_depth = 0.0
depth_compare = "WEBGPU_COMPARE_NEVER"
[module."webgpu:probe@1.0.0".config]
scene = "withdepth"
'''
