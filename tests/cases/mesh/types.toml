[case.false]
run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "-I", "include", "-c", "tests/types/alone.c", "-o", "{case}/alone.o"]

[[case]]
name = "the module declares webgpu:Frame with the descriptor of webgpu_contract.h"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
has = ["type 'webgpu:Frame' has another component layout here"]

[case.folders]
"{case}/m" = ["fake", "webgpu_mesh", "{wgpu_native}/{wgpu_file}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
rounds = 1
[content]
paths = ["m"]
ignore = ["m/{wgpu_file}"]
[backend]
native = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/m" = ["webgpu_mesh", "probe", "{wgpu_native}/{wgpu_file}"]
